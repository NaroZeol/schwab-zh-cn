name: Extension CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate manifest and source
        run: node scripts/check-extension.mjs
      - name: Build and verify installation ZIP
        run: |
          mkdir -p dist
          zip -q dist/schwab-zh-cn.zip manifest.json translate.js translations.js positions.css
          unzip -t dist/schwab-zh-cn.zip
      - uses: actions/upload-artifact@v7
        with:
          name: schwab-zh-cn
          path: dist/schwab-zh-cn.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: schwab-zh-cn
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          file="dist/schwab-zh-cn-${GITHUB_REF_NAME}.zip"
          mv dist/schwab-zh-cn.zip "$file"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
            if ! grep -Fxq "$(basename "$file")" <<< "$assets"; then
              gh release upload "$GITHUB_REF_NAME" "$file"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$file" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
